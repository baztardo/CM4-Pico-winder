<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winder Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            color: #4CAF50;
            font-size: 28px;
        }
        
        .status {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f44336;
        }
        
        .status-dot.connected {
            background: #4CAF50;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .panel {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
        }
        
        .panel h2 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .console {
            grid-column: 1 / -1;
        }
        
        .console-output {
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin-bottom: 10px;
        }
        
        .console-line {
            margin-bottom: 4px;
            line-height: 1.4;
        }
        
        .console-line.command {
            color: #2196F3;
        }
        
        .console-line.response {
            color: #e0e0e0;
        }
        
        .console-line.error {
            color: #f44336;
        }
        
        .console-input {
            display: flex;
            gap: 10px;
        }
        
        input[type="text"] {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 10px;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button.secondary {
            background: #2196F3;
        }
        
        button.secondary:hover {
            background: #1976D2;
        }
        
        button.danger {
            background: #f44336;
        }
        
        button.danger:hover {
            background: #d32f2f;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-size: 14px;
        }
        
        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        input[type="number"] {
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 10px;
            color: #e0e0e0;
            font-size: 16px;
            width: 100px;
            text-align: center;
        }
        
        .value-display {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .sensor-item {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 4px;
        }
        
        .sensor-label {
            color: #b0b0b0;
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .sensor-value {
            font-size: 24px;
            font-weight: bold;
            color: #2196F3;
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        
        .button-grid button {
            padding: 15px;
            font-size: 16px;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .sensor-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 Winder Console</h1>
            <div class="status">
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Disconnected</span>
                </div>
            </div>
        </header>
        
        <div class="grid">
            <!-- Winder Controls -->
            <div class="panel">
                <h2>Winder Controls</h2>
                
                <div class="control-group">
                    <label>RPM</label>
                    <div class="control-row">
                        <button onclick="adjustRPM(-50)">-50</button>
                        <input type="number" id="rpmInput" value="300" min="10" max="3300" step="10">
                        <button onclick="adjustRPM(50)">+50</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>Layers</label>
                    <div class="control-row">
                        <button onclick="adjustLayers(-1)">-1</button>
                        <input type="number" id="layersInput" value="10" min="1" max="100" step="1">
                        <button onclick="adjustLayers(1)">+1</button>
                    </div>
                </div>
                
                <div class="button-grid">
                    <button onclick="homeTraverse()">Home & Calibrate</button>
                    <button onclick="startWinding()" class="secondary">Start Winding</button>
                    <button onclick="stopWinding()" class="danger">Stop Winding</button>
                    <button onclick="querySensors()" class="secondary">Query Sensors</button>
                </div>
            </div>
            
            <!-- Sensor Status -->
            <div class="panel">
                <h2>Sensor Status</h2>
                
                <div class="sensor-grid">
                    <div class="sensor-item">
                        <div class="sensor-label">Angle</div>
                        <div class="sensor-value" id="angleValue">--°</div>
                    </div>
                    <div class="sensor-item">
                        <div class="sensor-label">Turn Count</div>
                        <div class="sensor-value" id="turnCount">--</div>
                    </div>
                    <div class="sensor-item">
                        <div class="sensor-label">Hall Count</div>
                        <div class="sensor-value" id="hallCount">--</div>
                    </div>
                    <div class="sensor-item">
                        <div class="sensor-label">Spindle RPM</div>
                        <div class="sensor-value" id="spindleRPM">--</div>
                    </div>
                </div>
            </div>
            
            <!-- Console -->
            <div class="panel console">
                <h2>Console</h2>
                <div class="console-output" id="consoleOutput"></div>
                <div class="console-input">
                    <input type="text" id="commandInput" placeholder="Enter G-code command..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendCommand()">Send</button>
                    <button onclick="clearConsole()" class="secondary">Clear</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let requestId = 1;
        
        // Connect to Moonraker
        function connect() {
            // If accessing via port 8080, connect to Moonraker on 7125
            const host = window.location.hostname || 'winder.local';
            const wsUrl = `ws://${host}:7125/websocket`;
            
            console.log('Connecting to:', wsUrl);
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                updateStatus(true);
                addConsole('Connected to Moonraker', 'response');
                
                // Subscribe to sensor status updates
                subscribeToObjects();
            };
            
            ws.onclose = () => {
                updateStatus(false);
                addConsole('Disconnected from Moonraker', 'error');
                setTimeout(connect, 3000); // Reconnect after 3s
            };
            
            ws.onerror = (error) => {
                addConsole('WebSocket error', 'error');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
        }
        
        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (connected) {
                dot.classList.add('connected');
                text.textContent = 'Connected';
            } else {
                dot.classList.remove('connected');
                text.textContent = 'Disconnected';
            }
        }
        
        function handleMessage(data) {
            if (data.method === 'notify_gcode_response') {
                const response = data.params[0];
                addConsole(response, 'response');
                
                // Parse sensor data from responses
                parseSensorData(response);
            } else if (data.method === 'notify_status_update') {
                // Handle live status updates
                updateSensorDisplay(data.params[0]);
            }
        }
        
        function parseSensorData(text) {
            // Parse QUERY_HW_COUNTER response for spindle_hall
            if (text.includes("spindle_hall")) {
                const countMatch = text.match(/Count:\s*(\d+)/);
                const rpmMatch = text.match(/RPM:\s*([\d.]+)/);
                const turnsMatch = text.match(/Turns:\s*([\d.]+)/);
                
                if (countMatch) {
                    document.getElementById('hallCount').textContent = countMatch[1];
                }
                if (rpmMatch) {
                    document.getElementById('spindleRPM').textContent = parseFloat(rpmMatch[1]).toFixed(1);
                }
                if (turnsMatch) {
                    document.getElementById('turnCount').textContent = parseFloat(turnsMatch[1]).toFixed(1);
                }
            }
            
            // Parse QUERY_HW_COUNTER response for bldc_hall
            if (text.includes("bldc_hall")) {
                const countMatch = text.match(/Count:\s*(\d+)/);
                const turnsMatch = text.match(/Turns:\s*([\d.]+)/);
                
                if (countMatch) {
                    document.getElementById('angleValue').textContent = countMatch[1] + ' pulses';
                }
                if (turnsMatch) {
                    // Could display BLDC turns somewhere if needed
                }
            }
        }
        
        function updateSensorDisplay(status) {
            // Update from live object status
            if (status.angle_sensor) {
                const angle = status.angle_sensor.current_angle_deg || 0;
                const turns = status.angle_sensor.revolutions || 0;
                document.getElementById('angleValue').textContent = angle.toFixed(1) + '°';
                document.getElementById('turnCount').textContent = turns;
            }
            
            if (status.hw_counter) {
                const count = status.hw_counter.count || 0;
                const rpm = status.hw_counter.rpm || 0;
                document.getElementById('hallCount').textContent = count;
                document.getElementById('spindleRPM').textContent = rpm.toFixed(1);
            }
        }
        
        function sendGcode(command) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addConsole('Not connected', 'error');
                return;
            }
            
            const request = {
                jsonrpc: '2.0',
                method: 'printer.gcode.script',
                params: {
                    script: command
                },
                id: requestId++
            };
            
            ws.send(JSON.stringify(request));
            addConsole(`> ${command}`, 'command');
        }
        
        function addConsole(text, type = 'response') {
            const output = document.getElementById('consoleOutput');
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = text;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }
        
        function clearConsole() {
            document.getElementById('consoleOutput').innerHTML = '';
        }
        
        function sendCommand() {
            const input = document.getElementById('commandInput');
            const command = input.value.trim();
            if (command) {
                sendGcode(command);
                input.value = '';
            }
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendCommand();
            }
        }
        
        // Winder controls
        function adjustRPM(delta) {
            const input = document.getElementById('rpmInput');
            let value = parseInt(input.value) + delta;
            value = Math.max(10, Math.min(3300, value));
            input.value = value;
        }
        
        function adjustLayers(delta) {
            const input = document.getElementById('layersInput');
            let value = parseInt(input.value) + delta;
            value = Math.max(1, Math.min(100, value));
            input.value = value;
        }
        
        function homeTraverse() {
            sendGcode('HOME_TRAVERSE');
        }
        
        function startWinding() {
            const rpm = document.getElementById('rpmInput').value;
            const layers = document.getElementById('layersInput').value;
            sendGcode(`WINDER_START RPM=${rpm} LAYERS=${layers}`);
        }
        
        function stopWinding() {
            sendGcode('WINDER_STOP');
        }
        
        function querySensors() {
            sendGcode('QUERY_HW_COUNTER COUNTER=spindle_hall');
            sendGcode('QUERY_HW_COUNTER COUNTER=bldc_hall');
        }
        
        function subscribeToObjects() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }
            
            const request = {
                jsonrpc: '2.0',
                method: 'printer.objects.subscribe',
                params: {
                    objects: {
                        angle_sensor: ['current_angle_deg', 'revolutions'],
                        hw_counter: ['count', 'rpm']
                    }
                },
                id: requestId++
            };
            
            ws.send(JSON.stringify(request));
            addConsole('Subscribed to sensor updates', 'response');
        }
        
        // Auto-refresh sensors every 2 seconds
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                querySensors();
            }
        }, 2000);
        
        // Initialize
        connect();
    </script>
</body>
</html>
