# ============================================================
# MODULAR WINDER CONFIGURATION v2 (RatOS Style)
# ============================================================
# This is the PROPER modular config system.
# 
# How it works:
# - Base config defines ALL sections with DEFAULT values
# - Preset files OVERRIDE only specific parameters
# - Klipper merges them automatically (no duplication!)
# ============================================================

# ============================================================
# PRINTER CONFIGURATION
# ============================================================
[printer]
kinematics: winder
max_velocity: 120   # Maximum traverse speed (mm/s)
max_accel: 10       # Maximum acceleration (mm/s²) - VERY LOW for slow traverse moves
square_corner_velocity: 1.0

# ============================================================
# CORE MODULES (Complete definitions with defaults)
# ============================================================

# BLDC Motor (complete definition - pins added by board config)
[bldc_motor]
max_rpm: 4948.0
min_rpm: 10.0
min_pwm_duty: 0.05
pwm_frequency: 1000.0

# Hardware Counter (complete definition - pin added by board config)
[hw_counter]
sample_time: 0.1

# Angle Sensor (complete definition - pin added by board config)
[angle_sensor]
max_angle: 360.0
angle_auto_calibrate: True
saturation_threshold: 1.0
sensor_vcc: 5.0

# ============================================================
# HARDWARE CONFIGURATION (Board-specific pins)
# ============================================================
# Board: Choose your control board
# This MUST come AFTER the hardware sections above so it extends them!
[include boards/manta-m4p.cfg]
# [include boards/manta-m8p.cfg]  # Uncomment for M8P
# [include boards/skr-pico.cfg]   # Uncomment for SKR Pico

# Traverse Control (complete definition)
[traverse]
stepper: stepper_y
max_position: 82.0
home_offset: 2.0

# Winder Control (complete definition with ALL parameters)
[winder_control]
# Hardware references
bldc_motor: bldc_motor
angle_sensor: angle_sensor
spindle_hall: hw_counter
traverse: traverse

# DEFAULT winding parameters (will be overridden by preset)
gear_ratio: 0.667
wire_diameter: 0.056
wire_coating_margin: 0.016
bobbin_width: 6.35
spindle_edge: 43.0
home_offset: 2.0

# Speed limits
max_spindle_rpm: 3300.0
min_spindle_rpm: 10.0

# Calibration
motor_speed_calibration: 1.09
hall_sensor_correction: 1.0

# Sync parameters
sync_update_rate: 5.0   # Hz (Reduced to 5Hz to prevent "Timer too close")
sync_tolerance: 0.05

# ============================================================
# PICKUP PRESET (Override specific parameters)
# ============================================================
# Choose your pickup type - it will override defaults above
[include presets/humbucker-override.cfg]
# [include presets/stratocaster-override.cfg]  # Uncomment for Strat
# [include presets/p90-override.cfg]           # Uncomment for P90

# ============================================================
# MACROS
# ============================================================
[include macros/winding.cfg]
[include macros/pickup-presets.cfg]

# ============================================================
# MOONRAKER REQUIREMENTS
# ============================================================
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

# ============================================================
# OPTIONAL: Query modules
# ============================================================
[query_adc]
[query_endstops]

