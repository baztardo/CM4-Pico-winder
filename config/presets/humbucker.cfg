# Humbucker Pickup Preset
# Standard Gibson-style humbucker configuration
# These parameters are used by [winder_control]

[winder_control]
# Wire specifications
wire_diameter: 0.056        # 43 AWG bare copper wire diameter (±0.001mm tolerance)
wire_coating_margin: 0.016  # Single Build enamel: 0.008mm per side × 2 = 0.016mm total

# Bobbin dimensions
bobbin_width: 6.35          # Humbucker bobbin traverse width (mm)

# Traverse parameters
spindle_edge: 43.0          # Spindle edge offset for the traverse carriage
home_offset: 2.0

# Motor speed calibration (compensates for motor not reaching commanded RPM)
motor_speed_calibration: 1.09

# Hall sensor correction (1.0 for single-edge detection)
hall_sensor_correction: 1.0

