# P90 Pickup Preset
# Gibson P90 single-coil configuration

[winder_control]
# Wire specifications
wire_diameter: 0.063        # 42 AWG bare copper wire diameter
wire_coating_margin: 0.016  # Single Build enamel

# Bobbin dimensions
bobbin_width: 15.0          # P90 bobbin width (mm)

# Traverse parameters
spindle_edge: 43.0
home_offset: 2.0

# Motor speed calibration
motor_speed_calibration: 1.09

# Hall sensor correction
hall_sensor_correction: 1.0

