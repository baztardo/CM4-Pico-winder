# ============================================================
# MODULAR WINDER CONFIGURATION
# ============================================================
# This is the new modular config system inspired by RatOS.
# To use: Copy this to ~/printer.cfg on your CM4
#
# Benefits:
# - Easy to swap hardware (just change one include line)
# - Share presets with others
# - Update one file, all configs benefit
# - Clean, organized structure
# ============================================================

# ============================================================
# PRINTER CONFIGURATION
# ============================================================
[printer]
kinematics: winder
max_velocity: 120   # Maximum traverse speed (mm/s)
max_accel: 100      # Maximum acceleration (mm/s²) - lowered to prevent timer overload
square_corner_velocity: 5.0  # Reduce corner speed to prevent loud noise

# ============================================================
# HARDWARE CONFIGURATION
# ============================================================
# Board: Choose your control board
[include boards/manta-m4p.cfg]
# [include boards/manta-m8p.cfg]  # Uncomment for M8P
# [include boards/skr-pico.cfg]   # Uncomment for SKR Pico

# Hardware: Motor and sensor configurations
[include hardware/bldc-motor.cfg]
[include hardware/angle-sensor-5v.cfg]
# [include hardware/angle-sensor-3.3v.cfg]  # Uncomment when you get the 3.3V sensor
[include hardware/hall-sensor.cfg]

# ============================================================
# PICKUP PRESET
# ============================================================
# Choose your pickup type (or create your own!)
[include presets/humbucker.cfg]
# [include presets/stratocaster.cfg]  # Uncomment for Strat
# [include presets/p90.cfg]           # Uncomment for P90

# ============================================================
# WINDER CONTROL (Main Coordinator)
# ============================================================
[winder_control]
bldc_motor: bldc_motor
angle_sensor: angle_sensor
spindle_hall: hw_counter
traverse: traverse

# Gear ratio
gear_ratio: 0.667       # 40:60 gear ratio (motor:spindle)

# Speed limits
max_spindle_rpm: 3300.0
min_spindle_rpm: 10.0

# Sync parameters
sync_update_rate: 5.0  # Hz (lowered to prevent timer overload during calibration)
sync_tolerance: 0.05    # 5% tolerance

# ============================================================
# TRAVERSE CONTROL
# ============================================================
[traverse]
stepper: stepper_y
max_position: 82.0
home_offset: 2.0

# ============================================================
# MACROS
# ============================================================
[include macros/winding.cfg]
[include macros/pickup-presets.cfg]

# ============================================================
# MOONRAKER REQUIREMENTS
# ============================================================
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

# ============================================================
# OPTIONAL: Query modules
# ============================================================
[query_adc]
[query_endstops]

