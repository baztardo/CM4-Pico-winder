# Quick test macro
[gcode_macro WIND_TEST]
description: Quick test wind (1 layer @ 100 RPM)
gcode:
    M117 Running test wind...
    HOME_TRAVERSE
    M117 Test: 1 layer @ 100 RPM
    WINDER_START RPM=100 LAYERS=1

