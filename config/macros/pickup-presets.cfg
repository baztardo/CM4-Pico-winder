# Pickup-Specific Winding Macros
# One-click winding for common pickup types

[gcode_macro WIND_HUMBUCKER]
description: Wind a standard humbucker pickup (1 layer @ 300 RPM)
gcode:
    {% set rpm = params.RPM|default(300)|int %}
    {% set layers = params.LAYERS|default(1)|int %}
    M117 Loading humbucker preset...
    HOME_TRAVERSE
    M117 Winding humbucker: {layers} layer(s) @ {rpm} RPM
    WINDER_START RPM={rpm} LAYERS={layers}

