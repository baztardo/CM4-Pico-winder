# G-code Macros

[gcode_macro HOME_TRAVERSE]
description: Home traverse and calibrate spindle angle sensor
gcode:
    M117 Homing traverse...
    G28 Y
    G1 Y43 F250    # mm/min
    M117 Calibrating angle sensor..
    M117 Ready

[gcode_macro START_WINDING]
description: Start winding operation
gcode:
    {% set rpm = params.RPM|default(100)|float %}
    {% set layers = params.LAYERS|default(1)|int %}
    CALIBRATE_SPINDLE
    HOME_TRAVERSE
    WINDER_START RPM={rpm} LAYERS={layers}
    M117 Winding at {rpm} RPM

[gcode_macro STOP_WINDING]
description: Stop winding
gcode:
    WINDER_STOP
    M117 Stopped

[gcode_macro CALIBRATE_SPINDLE]
description: Calibrate angle sensor by rotating spindle
gcode:
    M117 Calibrating spindle...
    # Reset angle sensor calibration
    ANGLE_SENSOR_CALIBRATE ACTION=RESET
    # Spin spindle for 3 full revolutions at low speed to calibrate
    BLDC_START RPM=100
    G4 P1800  # Wait 1.8 seconds (100 RPM = 1.67 rev/s, so 1.8s ≈ 3 revolutions)
    BLDC_STOP
    M117 Calibration complete
