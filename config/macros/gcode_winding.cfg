# G-code File-Based Winding Macros

[gcode_macro GENERATE_WINDING_GCODE]
description: Generate a winding G-code file
gcode:
    {% set rpm = params.RPM|default(100)|float %}
    {% set layers = params.LAYERS|default(1)|int %}
    {% set name = params.NAME|default("winding")|string %}
    
    {action_respond_info("Generating G-code file: %s.gcode" % name)}
    {action_respond_info("  RPM: %.1f" % rpm)}
    {action_respond_info("  Layers: %d" % layers)}
    
    # This would call the Python script to generate the file
    # For now, just inform the user to run the script manually
    {action_respond_info("Run on CM4:")}
    {action_respond_info("  python3 ~/generate_winding_gcode.py --rpm %.1f --layers %d --output ~/printer_data/gcodes/%s.gcode" % (rpm, layers, name))}

[gcode_macro RUN_WINDING_FILE]
description: Run a pre-generated winding G-code file
gcode:
    {% set name = params.NAME|default("winding")|string %}
    
    M117 Loading {name}.gcode...
    SDCARD_PRINT_FILE FILENAME={name}.gcode

[gcode_macro LIST_WINDING_FILES]
description: List available winding G-code files
gcode:
    M20  ; List SD card files

# Example usage:
# 1. Generate file: GENERATE_WINDING_GCODE RPM=300 LAYERS=2 NAME=humbucker_300rpm
# 2. Run file: RUN_WINDING_FILE NAME=humbucker_300rpm
# 3. Pause: M25
# 4. Resume: M24
# 5. Cancel: M25 then WINDER_STOP

