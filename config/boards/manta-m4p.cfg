# BigTreeTech Manta M4P Board Configuration
# STM32G0B1 MCU with TMC2209 drivers

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_5700170005504E5238363120-if00

# Traverse Stepper (Y-Axis) - M4P PINS
[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
endstop_pin: ^!PC1
position_endstop: 0
position_min: 0
position_max: 82
homing_speed: 5
homing_retract_dist: 5
homing_retract_speed: 5
second_homing_speed: 5
homing_positive_dir: False
rotation_distance: 1.0
microsteps: 32
full_steps_per_rotation: 200

[tmc2209 stepper_y]
uart_pin: PC10
interpolate: True
run_current: 0.400
hold_current: 0.100
stealthchop_threshold: 999999

# BLDC Motor Pins (extends section from main config)
[bldc_motor]
pwm_pin: PA9       # PWM capable pin (verified working)
dir_pin: PB4       # E0 DIR
brake_pin: PD5     # E0 ENA (HIGH = brake ON)
power_pin: PB7     # Bed heater port

# Hardware hall counter (extends section from main config)
[hw_counter]
pin: ^PA15         # Pull-up enabled for hall sensor

# Angle Sensor (extends section from main config)
[angle_sensor]
sensor_pin: PA1    # BLTouch SERVOS port - factory ADC with voltage conditioning

