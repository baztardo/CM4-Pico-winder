# Manta M4P Configuration - Modular Winder System
# MCU Configuration
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_5700170005504E5238363120-if00

[printer]
kinematics: winder
max_velocity: 120   # Maximum traverse speed (mm/s)
max_accel: 500      # Maximum acceleration (mm/s²)
square_corner_velocity: 5.0  # Reduce corner speed to prevent loud noise

# Traverse Stepper (Y-Axis) - M4P PINS
[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
endstop_pin: ^!PC1
position_endstop: 0
position_min: 0
position_max: 82
homing_speed: 5
homing_retract_dist: 5
homing_retract_speed: 5
second_homing_speed: 5
homing_positive_dir: False
rotation_distance: 1.0
microsteps: 32
full_steps_per_rotation: 200

[tmc2209 stepper_y]
uart_pin: PC10
interpolate: True
run_current: 0.400
hold_current: 0.100
stealthchop_threshold: 999999
interpolate: True

# BLDC Motor Module
[bldc_motor]
pwm_pin: PA9       # PWM capable pin (verified working)
dir_pin: PB4       # E0 DIR
brake_pin: PD5     # E0 ENA (HIGH = brake ON)
power_pin: PB7     # Bed heater port
max_rpm: 4948.0    # Maximum motor RPM (spindle max / gear ratio)
min_rpm: 10.0
pwm_frequency: 1000.0
min_pwm_duty: 0.05

# Hardware hall counter (STM32 EXTI)
# NOTE: hw_counter.c is configured for RISING EDGE ONLY detection
# This means: 1 magnet = 1 pulse per revolution (not 2)
# If you see double counting, check EXTI->RTSR1/FTSR1 configuration in hw_counter.c
[hw_counter]
pin: ^PA15           # Pull-up enabled (^) for hall sensor
sample_time: 0.1     # Report interval (seconds)

# Angle Sensor (12-bit ADC)
[angle_sensor]
sensor_pin: PA1   # BLTouch SERVOS port - factory ADC with voltage conditioning
max_angle: 360.0
sensor_vcc: 5.0
angle_auto_calibrate: True
saturation_threshold: 1.0  # Allow full range - no saturation warnings during calibration

# Traverse Control
[traverse]
stepper: stepper_y
max_position: 82.0
home_offset: 2.0

# Winder Control (Main Coordinator)
[winder_control]
bldc_motor: bldc_motor
angle_sensor: angle_sensor
spindle_hall: hw_counter
traverse: traverse

# Winding parameters
gear_ratio: 0.667       # 40:60 gear ratio (motor:spindle) - only affects motor PWM calculation
wire_diameter: 0.056    # 43 AWG bare copper wire diameter (±0.001mm tolerance)
wire_coating_margin: 0.016  # Single Build enamel: 0.008mm per side × 2 = 0.016mm total diameter increase
bobbin_width: 6.35      # Humbucker bobbin traverse width
spindle_edge: 43.0      # Spindle edge offset for the traverse carriage
home_offset: 2.0

# Speed limits
max_spindle_rpm: 3300.0
min_spindle_rpm: 10.0

# Motor speed calibration (compensates for motor not reaching commanded RPM)
# Calibrated: 315 actual / 300 target = 1.05× overcorrection, adjust down
# 1.143 × (300/315) = 1.089
motor_speed_calibration: 1.09

# Hall sensor calibration (compensates for missed edges or double-counting)
# CURRENT: hw_counter.c configured for RISING EDGE ONLY (after firmware update)
#   - 1 magnet + rising edge only = 1 pulse per revolution → use 1.0
# IF REVERTING TO BOTH EDGES:
#   - 1 magnet + both edges = 2 pulses per revolution → use 0.5
hall_sensor_correction: 1.0

# Sync parameters
sync_update_rate: 10.0  # Hz (reduced to avoid "Timer too close")
sync_tolerance: 0.05    # 5% tolerance

# Optional: Query modules
[query_adc]
[query_endstops]

# Moonraker requirements
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

# G-code Macros
[gcode_macro HOME_TRAVERSE]
description: Home traverse and calibrate spindle angle sensor
gcode:
    M117 Homing traverse...
    G28 Y
    G1 Y50 F50    # F50 = 50 mm/s
    M117 Calibrating angle sensor...
    CALIBRATE_SPINDLE
    M117 Ready

[gcode_macro START_WINDING]
description: Start winding operation
gcode:
    {% set rpm = params.RPM|default(100)|float %}
    {% set layers = params.LAYERS|default(1)|int %}
    HOME_TRAVERSE
    WINDER_START RPM={rpm} LAYERS={layers}
    M117 Winding at {rpm} RPM

[gcode_macro STOP_WINDING]
description: Stop winding
gcode:
    WINDER_STOP
    M117 Stopped

[gcode_macro CALIBRATE_SPINDLE]
description: Calibrate angle sensor by rotating spindle
gcode:
    M117 Calibrating spindle...
    # Reset angle sensor calibration
    ANGLE_SENSOR_CALIBRATE ACTION=RESET
    # Spin spindle for 3 full revolutions at low speed to calibrate
    BLDC_START RPM=100
    G4 P1800  # Wait 1.8 seconds (100 RPM = 1.67 rev/s, so 1.8s ≈ 3 revolutions)
    BLDC_STOP
    M117 Calibration complete

