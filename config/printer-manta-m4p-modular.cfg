# Manta M4P Configuration - Modular Winder System
# MCU Configuration
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_5700170005504E5238363120-if00  # Auto-detected

[printer]
kinematics: winder
max_velocity: 120   # Maximum traverse speed (mm/s)
max_accel: 500      # Maximum acceleration (mm/s²)

# Traverse Stepper (Y-Axis) - M4P PINS
[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
endstop_pin: ^!PC1
position_endstop: 0
position_min: 0
position_max: 82
homing_speed: 5
homing_retract_dist: 5
homing_retract_speed: 5
second_homing_speed: 5
homing_positive_dir: False
rotation_distance: 1.0
microsteps: 32
full_steps_per_rotation: 200

[tmc2209 stepper_y]
uart_pin: PC10
interpolate: True
run_current: 0.400
hold_current: 0.100
stealthchop_threshold: 999999
interpolate: True

# BLDC Motor Module
[bldc_motor]
pwm_pin: PB3       # E0 STEP - PWM capable
dir_pin: PB4       # E0 DIR
brake_pin: PD5     # E0 ENA (HIGH = brake ON)
power_pin: PB7     # Bed heater port
max_rpm: 4948.0    # Maximum motor RPM (spindle max / gear ratio)
min_rpm: 10.0
pwm_frequency: 1000.0
min_pwm_duty: 0.05

# Spindle Hall Sensor
[spindle_hall]
hall_pin: ^PC15    # Spindle Hall sensor (NPN NO, pull-up)
pulses_per_revolution: 1
sample_time: 0.01
poll_time: 0.1

# Angle Sensor (12-bit ADC)
[angle_sensor]
sensor_pin: PA1    # BLTOUCH port - factory ADC with voltage conditioning
max_angle: 360.0
sensor_vcc: 5.0
angle_auto_calibrate: True
saturation_threshold: 0.95

# Traverse Control
[traverse]
stepper: stepper_y
max_position: 82.0
home_offset: 2.0

# Winder Control (Main Coordinator)
[winder_control]
bldc_motor: bldc_motor
angle_sensor: angle_sensor
spindle_hall: spindle_hall
traverse: traverse

# Winding parameters
gear_ratio: 0.667       # 40:60 gear ratio (motor:spindle)
wire_diameter: 0.056    # 43 AWG copper wire
bobbin_width: 12.0
spindle_edge: 38.0      # Spindle edge offset
home_offset: 2.0

# Speed limits
max_spindle_rpm: 3300.0
min_spindle_rpm: 10.0

# Sync parameters
sync_update_rate: 10.0  # Hz (reduced to avoid "Timer too close")
sync_tolerance: 0.05    # 5% tolerance

# Optional: Query modules
[query_adc]
[query_endstops]

# G-code Macros
[gcode_macro HOME_TRAVERSE]
description: Home traverse and move to start position
gcode:
    G28 Y
    G1 Y50 F50    # F parameter = mm/s
    M117 Traverse homed

[gcode_macro START_WINDING]
description: Start winding operation
gcode:
    {% set rpm = params.RPM|default(100)|float %}
    {% set layers = params.LAYERS|default(1)|int %}
    HOME_TRAVERSE
    WINDER_START RPM={rpm} LAYERS={layers}
    M117 Winding at {rpm} RPM

[gcode_macro STOP_WINDING]
description: Stop winding
gcode:
    WINDER_STOP
    M117 Stopped