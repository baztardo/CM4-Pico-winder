# Manta M4P Configuration - Modular Winder System

# MCU Configuration
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_5700170005504E5238363120-if00

[printer]
kinematics: winder
max_velocity: 120   # Maximum traverse speed (mm/s)
max_accel: 300      # Maximum acceleration (mm/s²)
square_corner_velocity: 5.0  # Reduce corner speed to prevent loud noise

# Traverse Stepper (Y-Axis) - M4P PINS
[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
endstop_pin: ^!PC1
position_endstop: 0
position_min: 0
position_max: 82
homing_speed: 5
homing_retract_dist: 5
homing_retract_speed: 5
second_homing_speed: 5
homing_positive_dir: False
rotation_distance: 1.0
microsteps: 32
full_steps_per_rotation: 200

[tmc2209 stepper_y]
uart_pin: PC10
interpolate: True
run_current: 0.400
hold_current: 0.100
stealthchop_threshold: 999999
interpolate: True

# BLDC Motor Module
[bldc_motor]
pwm_pin: PA9       # PWM capable pin (verified working)
dir_pin: PB4       # E0 DIR
brake_pin: PD5     # E0 ENA (HIGH = brake ON)
power_pin: PB7     # Bed heater port
max_rpm: 4948.0    # Maximum motor RPM (spindle max / gear ratio)
min_rpm: 10.0
pwm_frequency: 1000.0
min_pwm_duty: 0.05

# Spindle hall counter (1 pulse per revolution - reference/verification)
# NOTE: hw_counter.c is configured for RISING EDGE ONLY detection
[hw_counter spindle_hall]
pin: ^PA15           # Pull-up enabled (^) for hall sensor
sample_time: 0.1     # Report interval (seconds)
counts_per_revolution: 1

# BLDC hall counter (18 pulses per revolution - position feedback)
# This is the SC output from the BLDC motor's internal hall sensors
# Measured: 176 pulses / 10 revolutions = 17.6 pulses/rev ≈ 18 pulses/rev
[hw_counter bldc_hall]
pin: ^PA1            # Pull-up enabled (^), was angle sensor ADC
sample_time: 0.1     # Report interval (seconds)
counts_per_revolution: 18

# Traverse Control
[traverse]
stepper: stepper_y
max_position: 82.0
home_offset: 2.0

# Winder Control (Main Coordinator)
[winder_control]
bldc_motor: bldc_motor
spindle_hall: spindle_hall
bldc_hall: bldc_hall
traverse: traverse

# Winding parameters
gear_ratio: 0.667       # 40:60 gear ratio (motor:spindle) - only affects motor PWM calculation
wire_diameter: 0.056    # 43 AWG bare copper wire diameter (±0.001mm tolerance)
wire_coating_margin: 0.016  # Single Build enamel: 0.008mm per side × 2 = 0.016mm total diameter increase
bobbin_width: 6.35      # Humbucker bobbin traverse width
spindle_edge: 43.0      # Spindle edge offset for the traverse carriage
home_offset: 2.0

# Speed limits
max_spindle_rpm: 3300.0
min_spindle_rpm: 10.0

# Motor speed calibration (compensates for motor not reaching commanded RPM)
# Measured: 500 commanded → 250 actual → factor 2.0
motor_speed_calibration: 1.99

# Hall sensor calibration
# Spindle hall: 1 pulse per revolution (rising edge only) = 1.0
# BLDC hall: 36 pulses per revolution = need to divide by 36 for turns
hall_sensor_correction: 1.0

# Sync parameters
sync_update_rate: 10.0  # Hz
sync_tolerance: 0.05    # 5% tolerance

# Optional: Query modules
[query_adc]
[query_endstops]

# Moonraker requirements
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

# G-code Macros
[gcode_macro HOME_TRAVERSE]
description: Home traverse and reset counters
gcode:
    M117 Homing traverse...
    G28 Y
    G1 Y43 F250    # mm/min
    M117 Resetting counters...
    RESET_HW_COUNTER COUNTER=spindle_hall
    RESET_HW_COUNTER COUNTER=bldc_hall
    M117 Ready

[gcode_macro START_WINDING]
description: Start winding operation
gcode:
    {% set rpm = params.RPM|default(100)|float %}
    {% set layers = params.LAYERS|default(1)|int %}
    CALIBRATE_SPINDLE
    HOME_TRAVERSE
    WINDER_START RPM={rpm} LAYERS={layers}
    M117 Winding at {rpm} RPM

[gcode_macro STOP_WINDING]
description: Stop winding
gcode:
    WINDER_STOP
    M117 Stopped

[gcode_macro CALIBRATE_SPINDLE]
description: Calibrate spindle sensors
gcode:
    M117 Calibrating spindle...
    RESET_HW_COUNTER COUNTER=spindle_hall
    RESET_HW_COUNTER COUNTER=bldc_hall
    BLDC_START RPM=100
    G4 P3000  # Wait 3 seconds (100 RPM = ~5 revolutions)
    BLDC_STOP
    M117 Calibration complete

[include macros/gcode_winding.cfg]
